[tox]
envlist = lint, type, py311, py312
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-qt
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run Ruff checkss
skip_install = true
deps =
    ruff
commands =
    ruff check src tests

[testenv:type]
description = Run Pyright
deps =
    basedpyright
    pytest
commands =
    basedpyright --pythonpath {envpython} src tests
